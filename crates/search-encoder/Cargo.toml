[package]
name = "search-encoder"
version = "0.1.0"
edition = "2021"
license = "MIT"
[features]
default = ["emb_int4"]
emb_int4 = []
[dependencies]
tokenizers = { version = "=0.19.1", default-features = false, features = ["fancy-regex", "unstable_wasm"] }
sha2 = { version = "0.10", default-features = false }
libm = { version = "0.2", default-features = false }
serde_json = "1"
[dev-dependencies]
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
