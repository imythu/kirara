openapi: 3.0.3
info:
  title: kirara Backend API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000

paths:
  /api/sites/search:
    get:
      summary: Search local sites
      description: All hard filters and relevance thresholds apply before counting and pagination. Requests share four admitted workers (at most one history request) and a 15-second deadline; saturation returns 503 and expiration returns 504. Out-of-range pages clamp to the last page. Empty results use page 1. Query length is limited to 256 Unicode scalar values.
      parameters:
        - {name: q, in: query, schema: {type: string, default: '', maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: health, in: query, schema: {type: string, enum: [healthy, failed, pending]}}
        - {name: type, in: query, schema: {type: string, minLength: 1}}
      responses:
        '200': {description: Search result, content: {application/json: {schema: {$ref: '#/components/schemas/SmartSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/search:
    get:
      summary: Search sign-in tasks
      description: All hard filters and relevance thresholds apply before counting and pagination. Requests share four admitted workers (at most one history request) and a 15-second deadline; saturation returns 503 and expiration returns 504. Out-of-range pages clamp to the last page. Empty results use page 1. Query length is limited to 256 Unicode scalar values.
      parameters:
        - {name: q, in: query, schema: {type: string, default: '', maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: site_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: result, in: query, schema: {type: string, enum: [success, failed, unknown]}}
      responses:
        '200': {description: Search result, content: {application/json: {schema: {$ref: '#/components/schemas/SmartSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/search:
    get:
      summary: Search brush tasks
      description: All hard filters and relevance thresholds apply before counting and pagination. Requests share four admitted workers (at most one history request) and a 15-second deadline; saturation returns 503 and expiration returns 504. Out-of-range pages clamp to the last page. Empty results use page 1. Query length is limited to 256 Unicode scalar values.
      parameters:
        - {name: q, in: query, schema: {type: string, default: '', maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: site_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: result, in: query, schema: {type: string, enum: [success, failed, unknown]}}
      responses:
        '200': {description: Search result, content: {application/json: {schema: {$ref: '#/components/schemas/SmartSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-records/search:
    get:
      summary: Search all stored sign-in records (no legacy 500 limit)
      x-history-processing: Two bounded 256-row passes with global name census and disk-backed temporary ranking; one prepared semantic result per query; exact totals and deep pages.
      description: All hard filters and relevance thresholds apply before counting and pagination. Requests share four admitted workers (at most one history request) and a 15-second deadline; saturation returns 503 and expiration returns 504. Out-of-range pages clamp to the last page. Empty results use page 1. Query length is limited to 256 Unicode scalar values.
      parameters:
        - {name: q, in: query, schema: {type: string, default: '', maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: task_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: site_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: result, in: query, schema: {type: string, enum: [success, failed, unknown]}}
      responses:
        '200': {description: Search result, content: {application/json: {schema: {$ref: '#/components/schemas/SmartSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/site-catalog/search:
    get:
      summary: Search public catalog entries for manual binding
      description: All hard filters and relevance thresholds apply before counting and pagination. Requests share four admitted workers (at most one history request) and a 15-second deadline; saturation returns 503 and expiration returns 504. Out-of-range pages clamp to the last page. Empty results use page 1. Query length is limited to 256 Unicode scalar values.
      parameters:
        - {name: q, in: query, schema: {type: string, default: '', maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Search result, content: {application/json: {schema: {$ref: '#/components/schemas/SmartSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}/search-binding:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: Resolve current search catalog association and domain provenance
      responses:
        '200': {description: Binding, content: {application/json: {schema: {$ref: '#/components/schemas/SiteSearchBinding'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Set auto, manual, or none search association
      description: Manual requires an existing catalog ID. Auto and none require catalog_id absent or null. Automatic identity uses verified domains only; manual survives URL changes and none survives restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: {type: string, enum: [auto, manual, none]}
                catalog_id: {type: string, nullable: true}
      responses:
        '200': {description: Updated binding, content: {application/json: {schema: {$ref: '#/components/schemas/SiteSearchBinding'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/settings:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalConfig'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GlobalConfig'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalConfig'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-profiles:
    get:
      summary: 获取已自动适配站点的固定签到器
      responses:
        '200':
          description: 仅包含已自动适配站点；任务保存及执行时由后端强制应用
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    site_id: {type: integer, format: int64}
                    profile:
                      type: object
                      properties:
                        id: {type: string}
                        label: {type: string}
                        browser: {type: string, enum: [lightpanda, browserless]}
                        sign_in_method: {type: string}
                        browserless: {$ref: '#/components/schemas/BrowserlessTaskConfig'}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SignInTask'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SignInTaskRequest'}}}
      responses:
        '200': {description: Created, content: {application/json: {schema: {type: object, properties: {id: {type: integer, format: int64}}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/{id}:
    put:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SignInTaskRequest'}}}
      responses:
        '200': {description: OK}
        default: {$ref: '#/components/responses/Error'}
    delete:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/{id}/start:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Enabled}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/{id}/stop:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Disabled}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/{id}/run:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Triggered}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-tasks/{id}/probe-1-1-1-1:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserProbeResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-probe-1-1-1-1:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SignInBrowserProbeRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserProbeResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sign-in-records:
    get:
      parameters:
        - {name: task_id, in: query, schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SignInRecord'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SiteResponse'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSiteRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/IdResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/catalog:
    get:
      summary: List searchable PT-Depiler site presets supported by kirara
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SitePreset'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/ptd-import:
    post:
      summary: Import PTD site cookies from a local backup
      description: Shares matching and transactional updates with WebDAV. Does not require the receiver to be enabled or change its settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_base64, existing_policy, auto_create]
              properties:
                content_base64: {type: string, format: byte, description: 'Unencrypted PTD ZIP or cookies.json, decoded limit 8 MiB'}
                existing_policy: {type: string, enum: [update, skip]}
                auto_create: {type: boolean}
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: integer}
                  updated: {type: integer}
                  unchanged: {type: integer}
                  skipped: {type: integer}
                  details: {type: array, items: {type: string}}
        '400': {description: Invalid import policy}
        '413': {description: Request body too large}
        '422': {description: Invalid file or encrypted backup}
        '500': {description: Import failed and transaction rolled back}

  /api/sites/webdav-sync:
    get:
      summary: Read embedded WebDAV receiver configuration and runtime status
      description: Never returns the password or its hash. Reception and background synchronization are separate states.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/WebDavSyncConfig'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Configure the embedded WebDAV receiver
      description: Changes take effect without restarting the application. Set rotate_password to generate a new 256-bit password; only this response includes new_password. Enabling requires a configured password. The receiver shares the main Web listener at /dav/ptd/ and requires HTTP Basic authentication.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WebDavSyncConfigInput'}}}
      responses:
        '200': {description: Saved; receiver enablement takes effect immediately, content: {application/json: {schema: {$ref: '#/components/schemas/WebDavSyncConfig'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/webdav-sync/runs:
    get:
      summary: List up to 100 latest WebDAV synchronization jobs
      description: Results and reasons are redacted; cookie values and uploaded bodies are never returned here.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WebDavSyncRun'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/webdav-sync/runs/{id}/retry:
    post:
      summary: Retry a failed sync job whose payload is still retained
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        '409': {description: Job is not failed or its payload was cleaned up}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/ptd-backup:
    get:
      summary: Read Hive PTD-compatible WebDAV backup configuration
      description: The stored WebDAV password is never returned.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PtdBackupConfigResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Update Hive PTD-compatible WebDAV backup configuration
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePtdBackupConfigRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PtdBackupConfigResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/ptd-backup/test:
    post:
      summary: Test an unsaved or stored WebDAV configuration with PROPFIND
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePtdBackupConfigRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PtdBackupTestResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/ptd-backup/run:
    post:
      summary: Generate and upload a PT-Depiler-compatible user information ZIP now
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PtdBackupRunResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}:
    put:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSiteRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}/credentials:
    get:
      summary: Retrieve stored credentials for one site on demand
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteCredentialsResponse'}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}/request-headers:
    get:
      summary: Retrieve stored custom request headers for one site on demand
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SiteRequestHeader'}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}/sync:
    post:
      description: Manually fetch and persist account statistics for one site. Failed syncs preserve previous statistics and record the error.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Sync result, content: {application/json: {schema: {$ref: '#/components/schemas/SiteSyncResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/{id}/stats:
    get:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/UserStats'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/stats-overview:
    get:
      description: Returns the latest site statistics stored in the local database without triggering remote site requests.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SiteResponse'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/sites/refresh-all:
    get:
      description: Returns whether a site statistics refresh is currently running.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteStatsRefreshStatusResponse'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: Starts a site statistics refresh in the background. Concurrent requests reuse the running refresh.
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/SiteStatsRefreshStartResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/downloaders:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DownloaderResponse'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateDownloaderRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/IdResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/downloaders/{id}:
    put:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateDownloaderRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/downloaders/{id}/test:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DownloaderTestResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/downloaders/{id}/space:
    get:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DownloaderSpaceStats'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/downloaders/{id}/torrents:
    get:
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: include_incomplete, in: query, required: false, schema: {type: boolean, default: false}, description: Include incomplete torrents for storage analysis.}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DownloaderTorrent'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BrushTaskRecord'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BrushTaskRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/IdResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrushTaskRecord'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BrushTaskRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/{id}/start:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/{id}/stop:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/{id}/run:
    post:
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/brush-tasks/{id}/torrents:
    get:
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: keyword
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrushTaskTorrentsResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/system/logs/stream:
    get:
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: log
                data: {"encoded_line":"hello%20world"}

  /api/stats/overview:
    get:
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StatsOverview'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/stats/trend:
    get:
      parameters:
        - {name: task_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: since, in: query, required: false, schema: {type: string}}
        - {name: until, in: query, required: false, schema: {type: string}}
        - {name: hours, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TaskStatsSnapshot'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/stats/downloader-speed-trend:
    get:
      parameters:
        - {name: downloader_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: since, in: query, required: false, schema: {type: string}}
        - {name: until, in: query, required: false, schema: {type: string}}
        - {name: hours, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DownloaderSpeedSnapshot'}}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/settings:
    get:
      summary: Get media automation settings
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSettingsResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Update media automation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMediaSettingsRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSettingsResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/tmdb/search:
    get:
      summary: Search TMDB
      parameters:
        - {name: query, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: media_type, in: query, required: false, schema: {type: string, enum: [multi, tv, movie], default: multi}}
      responses:
        '200':
          description: Matching TV and movie records
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TmdbMedia'}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/tmdb/details:
    get:
      summary: Get TMDB title details
      parameters:
        - {name: tmdb_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: media_type, in: query, required: true, schema: {type: string, enum: [tv, movie]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TmdbDetails'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/tmdb/season:
    get:
      summary: Get a TMDB TV season
      parameters:
        - {name: tmdb_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: season, in: query, required: true, schema: {type: integer, format: int32, minimum: 0, maximum: 1000}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TmdbSeason'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/quality-profiles:
    get:
      summary: List quality profiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/QualityProfile'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QualityProfileRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/QualityProfile'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/quality-profiles/{id}:
    get:
      summary: Get a quality profile
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/QualityProfile'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Update a quality profile
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QualityProfileRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/QualityProfile'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete a quality profile
      description: A profile referenced by a subscription cannot be deleted.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions:
    get:
      summary: List media subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MediaSubscription'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create a media subscription
      description: >-
        The server reloads TMDB details, aliases, and the selected TV season instead of trusting
        client-supplied metadata. Confirmed episodes and air dates are materialized atomically;
        unannounced episodes are not sent to PT indexers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMediaSubscriptionRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSubscription'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}:
    get:
      summary: Get a media subscription
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSubscription'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Update a media subscription
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMediaSubscriptionRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSubscription'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete a media subscription
      description: >-
        Deletes the subscription and all related kirara download records and automatic
        copy or relocation jobs. It does not delete qBittorrent torrents or files, and
        an OpenList task that has already been submitted remotely cannot be recalled.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}/run:
    post:
      summary: Run a subscription scan immediately
      description: Returns 409 if the subscription is completed or its lease is already held by another scan.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Scan completed, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionRunResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}/last-run:
    get:
      summary: Get the latest subscription scan diagnostics
      description: Returns the persisted queries, candidate parsing and match decisions from the latest run.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionRunSnapshot'}}}}
        '404': {description: Subscription not found or no run details have been recorded}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}/pause:
    post:
      summary: Pause a media subscription
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Paused, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSubscription'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}/resume:
    post:
      summary: Resume a media subscription
      description: A completed subscription must first be edited to select a new cursor; otherwise this returns 409.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Resumed, content: {application/json: {schema: {$ref: '#/components/schemas/MediaSubscription'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/subscriptions/{id}/downloads:
    get:
      summary: List downloads for a subscription
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {$ref: '#/components/parameters/MediaDownloadStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/BeforeId'}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Most recent records first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MediaDownload'}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/resources/search:
    post:
      summary: Search PT sites and evaluate releases
      description: >-
        Sites are searched concurrently. A failed site is reported in errors while successful
        sites still contribute candidates. Search results never contain Cookie, API key,
        password, authorization headers, or a long-lived signed download URL. Each result has a
        short-lived opaque candidate_id that binds later queue requests to the server-owned result.
        After global deduplication and ranking, at most the best 512 candidates are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceSearchRequest'}
      responses:
        '200': {description: Aggregated results, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/downloads:
    get:
      summary: List media download outbox records
      parameters:
        - {name: subscription_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/MediaDownloadStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/BeforeId'}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Most recent records first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MediaDownload'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Queue a selected PT resource
      description: >-
        The shared outbox provides at-least-once delivery. A stable dedupe key and the torrent
        infohash make retries idempotent per downloader; this is not an exactly-once transaction
        across SQLite and the downloader. The candidate_id must come from a recent resource search;
        client-supplied torrent locators, titles, and match decisions are not accepted. For a linked
        subscription, readiness and the match decision are revalidated atomically before enqueue.
        override_reason is required when the authoritative decision is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueueMediaDownloadRequest'}
      responses:
        '201': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/MediaDownload'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/downloads/{id}:
    get:
      summary: Get a media download outbox record
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MediaDownload'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete a terminal media download record from kirara
      description: >-
        Deletes local kirara history only. It never deletes a qB torrent, downloaded files, or
        OpenList data. Submitted subscription targets are reopened atomically when this is their
        current canonical record. Active downloads, subscription work, relocation jobs, and stale
        client versions return 409.
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Local record deleted, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteMediaDownloadResponse'}}}}
        '409':
          description: Record changed or related work is still active
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}

  /api/media/downloads/{id}/redeliver:
    post:
      summary: Verify or redeliver a submitted media download
      description: >-
        Confirms that the stored infohash exists in the configured downloader. If it is missing,
        the stored torrent locator is fetched again, its infohash is verified, and the torrent is
        resubmitted without changing subscription progression.
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses:
        '200': {description: Verified in downloader, content: {application/json: {schema: {$ref: '#/components/schemas/MediaDownload'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/media/downloads/{id}/reconcile-failed:
    post:
      summary: Resolve an unknown qB submission for a failed subscription download
      description: >-
        Queries qB by the stored infohash without adding or deleting anything. If qB confirms the
        torrent exists, the download and subscription target become submitted and progression
        advances atomically. If qB confirms it is absent, the failed audit record is retained and
        the target becomes pending so a later scan can retry. qB errors, stale versions, changed
        downloader identity, active relocation work, or subscription races leave all state unchanged.
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Unknown submission resolved, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileFailedMediaDownloadResponse'}}}}
        '409':
          description: Download, downloader, subscription, target, or relocation state changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: qB verification failed; no state was changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}

  /api/rss/summary:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1summary'

  /api/rss/feeds:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1feeds'

  /api/rss/feeds/test:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1feeds~1test'

  /api/rss/feeds/{id}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1feeds~1{id}'

  /api/rss/feeds/{id}/check:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1feeds~1{id}~1check'

  /api/rss/feeds/{id}/{action}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1feeds~1{id}~1{action}'

  /api/rss/rules:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1rules'

  /api/rss/rules/preview:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1rules~1preview'

  /api/rss/rules/{id}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1rules~1{id}'

  /api/rss/rules/{id}/{action}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1rules~1{id}~1{action}'

  /api/rss/items:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1items'

  /api/rss/items/{id}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1items~1{id}'

  /api/rss/backfills:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1backfills'

  /api/rss/downloads:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1downloads'

  /api/rss/downloads/{id}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1downloads~1{id}'

  /api/rss/downloads/{id}/{action}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1downloads~1{id}~1{action}'

  /api/rss/runs:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1runs'

  /api/rss/runs/{id}:
    $ref: './rss-openapi.yaml#/paths/~1api~1rss~1runs~1{id}'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    BeforeId:
      name: before_id
      in: query
      required: false
      description: Stable keyset cursor for older records; cannot be combined with page.
      schema: {type: integer, format: int64, minimum: 1}
    PageSize:
      name: page_size
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    MediaDownloadStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [queued, fetching, submitting, reconciling, retry_wait, submitted, failed, cancelled]

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

  schemas:
    SiteSearchBinding:
      type: object
      required: [site_id, mode, catalog_id, matched_host, catalog_revision]
      properties:
        site_id: {type: integer, format: int64}
        mode: {type: string, enum: [auto, manual, none]}
        catalog_id: {type: string, nullable: true}
        matched_host: {type: string, nullable: true}
        catalog_revision: {type: string}
    SmartSearchResponse:
      type: object
      required: [items, total, page, page_size, parsed_filters, semantic_status]
      properties:
        items:
          type: array
          items:
            type: object
            required: [record, matched_by]
            properties:
              record:
                type: object
                description: Existing scope DTO (SiteResponse, SignInTaskRecord, BrushTaskRecord, SignInRecord), or public catalog entry with id/name/url/aka. Site credentials are never included.
              matched_by: {type: array, items: {type: string}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        parsed_filters:
          type: array
          items:
            type: object
            required: [field, value]
            properties:
              field: {type: string}
              value: {type: string}
        semantic_status: {type: string, description: 'Visible semantic channel state, including not_needed, used, or degradation reason.'}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}

    GlobalConfig:
      type: object
      required: [log_level, proxy, use_proxy_for_lightpanda, lightpanda, browserless, tag_rule_scan_interval_mins, vision_llm]
      properties:
        log_level: {type: string, nullable: true, enum: [trace, debug, info, warn, error, null]}
        proxy: {type: string, nullable: true}
        use_proxy_for_lightpanda: {type: boolean}
        lightpanda: {$ref: '#/components/schemas/LightpandaConfig'}
        browserless: {$ref: '#/components/schemas/BrowserlessConfig'}
        tag_rule_scan_interval_mins: {type: integer, format: int64}
        vision_llm:
          type: object
          properties:
            base_url: {type: string, default: 'https://openrouter.ai/api/v1'}
            model: {type: string}
            api_key: {type: string, nullable: true, format: password, description: '响应始终为 null；更新时留空保留原值'}
            api_standard: {type: string, enum: [claude, openai_compatible, openai_responses], default: openai_responses}
            api_key_configured: {type: boolean, readOnly: true}
            clear_api_key: {type: boolean, default: false}

    LightpandaConfig:
      type: object
      required: [endpoint, token, region, browser, proxy, country]
      properties:
        endpoint: {type: string, nullable: true, pattern: '^wss?://'}
        token: {type: string, nullable: true, format: password}
        region: {type: string, enum: [euwest, uswest]}
        browser: {type: string, default: lightpanda}
        proxy: {type: string, nullable: true, default: fast_dc}
        country: {type: string, nullable: true}

    BrowserlessConfig:
      type: object
      required: [address, token]
      properties:
        address: {type: string, format: uri, nullable: true, pattern: '^https?://'}
        token: {type: string, nullable: true, format: password}

    SignInResultRule:
      type: object
      required: [outcome, kind]
      properties:
        outcome: {type: string, enum: [success, already, failed]}
        kind: {type: string, enum: [text, selector, json]}
        selector: {type: string, default: '', description: 可见元素选择器；文字匹配留空时使用整个页面}
        field: {type: string, default: '', description: JSON Pointer 路径，例如 /state 或 /data/status}
        value: {type: string, default: ''}
        value_type: {type: string, enum: [string, number, boolean, 'null'], default: string}

    BrowserlessTaskConfig:
      description: 签到器内部配置。已适配站点由后端固定；通用验证码签到只采用路径、图片选择器、输入框选择器、按钮选择器和已签到提示五项。其余字段保留兼容读取，保存及运行时由签到器重新生成。
      type: object
      required: [selector, cf_mode, wait_ms, solve_timeout, action_timeout, post_click_wait_ms]
      properties:
        submit_method: {type: string, enum: [click, form, ajax], default: click, description: 点击按钮、原生表单提交或同源 AJAX 表单提交}
        result_rules:
          type: array
          default: []
          maxItems: 30
          description: 优先级为失败、已签到、成功；提交前只匹配失败和已签到；配置规则后未命中按结果未知处理
          items: {$ref: '#/components/schemas/SignInResultRule'}
        attendance_path: {type: string, default: /attendance.php, description: 图片验证码签到使用的站内路径；皇后预设为 /plugin_sign-in.php}
        captcha_selector: {type: string, default: '', description: 验证码图片的 CSS Selector}
        captcha_input_selector: {type: string, default: '', description: 验证码输入框的 CSS Selector}
        already_keywords: {type: string, default: '', maxLength: 4096, description: 每行一条已签到提示；命中任意一条后跳过验证和提交；留空不启用}
        selector: {type: string, default: "input[type='submit']"}
        cf_mode: {type: string, enum: [auto, page, turnstile], default: auto}
        wait_ms: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 3600000}
        solve_timeout: {type: integer, format: int64, nullable: true, minimum: 1, maximum: 3600000}
        action_timeout: {type: integer, format: int64, nullable: true, minimum: 1, maximum: 3600000}
        post_click_wait_ms: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 3600000}

    SignInTaskRequest:
      type: object
      required: [name, site_id, cron_expression]
      properties:
        name: {type: string}
        site_id: {type: integer, format: int64}
        cron_expression: {type: string}
        browser: {type: string, enum: [lightpanda, browserless], default: lightpanda}
        sign_in_method: {type: string, enum: [open_page, cloudflare, ocr_captcha, u2], default: open_page}
        browserless: {$ref: '#/components/schemas/BrowserlessTaskConfig'}

    SignInTask:
      allOf:
        - {$ref: '#/components/schemas/SignInTaskRequest'}
        - type: object
          required: [id, browser, sign_in_method, browserless, enabled, created_at, updated_at]
          properties:
            id: {type: integer, format: int64}
            enabled: {type: boolean}
            last_status: {type: string, nullable: true}
            last_message: {type: string, nullable: true}
            last_run_at: {type: string, format: date-time, nullable: true}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}

    SignInBrowserProbeRequest:
      type: object
      required: [browser]
      properties:
        browser: {type: string, enum: [lightpanda, browserless]}

    BrowserProbeResult:
      type: object
      required: [success, url, message, title]
      properties:
        success: {type: boolean}
        url: {type: string, format: uri}
        message: {type: string}
        title: {type: string, nullable: true}

    SignInRecord:
      type: object
      required: [id, task_id, site_id, site_name, started_at, finished_at, status, message]
      properties:
        id: {type: integer, format: int64}
        task_id: {type: integer, format: int64}
        site_id: {type: integer, format: int64}
        site_name: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        status: {type: string, enum: [success, already, failed]}
        message: {type: string}

    SiteResponse:
      type: object
      description: Site list responses omit credentials; use the dedicated credentials endpoint to retrieve one site on demand.
      required:
        - id
        - name
        - site_type
        - base_url
        - auth_type
        - auth_configured
        - use_proxy
        - created_at
        - updated_at
        - stats
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        site_type: {type: string}
        base_url: {type: string}
        auth_type:
          type: string
          enum: [cookie, passkey, cookie_passkey, api_key]
          nullable: true
          readOnly: true
        auth_configured: {type: boolean, readOnly: true}
        use_proxy: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        stats: {allOf: [{$ref: '#/components/schemas/SiteStatsRecord'}], nullable: true}

    SitePreset:
      type: object
      description: PT-Depiler site metadata filtered to adapters currently supported by kirara.
      required: [ptd_id, name, site_type, base_url, aliases]
      properties:
        ptd_id: {type: string}
        name: {type: string}
        site_type: {type: string, enum: [nexusphp, mteam]}
        base_url: {type: string, format: uri}
        aliases:
          type: array
          items: {type: string}

    SiteStatsRefreshStartResponse:
      type: object
      required: [started, refreshing]
      properties:
        started: {type: boolean, description: True when this request started a new background refresh.}
        refreshing: {type: boolean, description: Whether a refresh was running when the response was created.}

    SiteStatsRefreshStatusResponse:
      type: object
      required: [refreshing]
      properties:
        refreshing: {type: boolean}

    WebDavSyncConfigInput:
      type: object
      additionalProperties: false
      required: [enabled, username, existing_policy, auto_create]
      properties:
        enabled: {type: boolean}
        username: {type: string, minLength: 1, maxLength: 128, default: ptd}
        existing_policy: {type: string, enum: [update, skip], default: update}
        auto_create: {type: boolean, default: true}
        rotate_password: {type: boolean, default: false}

    WebDavSyncConfig:
      type: object
      required: [enabled, username, existing_policy, auto_create, password_configured, running, runtime_error, last_received_at, path]
      properties:
        enabled: {type: boolean}
        username: {type: string}
        existing_policy: {type: string, enum: [update, skip]}
        auto_create: {type: boolean}
        password_configured: {type: boolean}
        running: {type: boolean}
        runtime_error: {type: string, nullable: true}
        last_received_at: {type: integer, format: int64, nullable: true, description: Unix milliseconds}
        path: {type: string, example: /dav/ptd/}
        new_password: {type: string, description: Returned only in the PUT response that rotates the password}

    WebDavSyncRun:
      type: object
      required: [id, name, received_at, status, attempts, result, error, can_retry]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        received_at: {type: integer, format: int64, description: Unix milliseconds}
        status: {type: string, enum: [pending, retry, done, failed]}
        attempts: {type: integer}
        can_retry: {type: boolean, description: Payload is retained; only failed jobs can be retried}
        error: {type: string, nullable: true}
        result:
          type: object
          nullable: true
          properties:
            created: {type: integer}
            updated: {type: integer}
            unchanged: {type: integer}
            skipped: {type: integer}
            details: {type: array, items: {type: string}}

    PtdBackupConfigResponse:
      type: object
      description: Hive PTD-compatible WebDAV configuration with its password redacted and PT-Depiler site IDs resolved automatically from site hosts.
      required: [enabled, webdav_url, username, password_configured, use_proxy, backup_interval_hours, site_identifiers, configured, last_backup_at, last_backup_filename, last_error, updated_at]
      properties:
        enabled: {type: boolean}
        webdav_url: {type: string, format: uri}
        username: {type: string}
        password_configured: {type: boolean, readOnly: true}
        use_proxy: {type: boolean}
        backup_interval_hours: {type: integer, format: int64, minimum: 1, maximum: 720}
        site_identifiers:
          type: object
          readOnly: true
          description: Map of local numeric site IDs to automatically resolved PT-Depiler site IDs; null means the host is unsupported and will not be backed up.
          additionalProperties: {type: string, nullable: true}
        configured: {type: boolean, readOnly: true}
        last_backup_at: {type: string, format: date-time, nullable: true, readOnly: true}
        last_backup_filename: {type: string, nullable: true, readOnly: true}
        last_error: {type: string, nullable: true, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}

    UpdatePtdBackupConfigRequest:
      type: object
      additionalProperties: false
      required: [webdav_url, backup_interval_hours]
      properties:
        enabled: {type: boolean, default: false}
        webdav_url: {type: string}
        username: {type: string, default: ''}
        password: {type: string, nullable: true, description: Omit or send an empty string to preserve the stored password.}
        clear_password: {type: boolean, default: false}
        use_proxy: {type: boolean, default: false}
        backup_interval_hours: {type: integer, format: int64, minimum: 1, maximum: 720}
    PtdBackupTestResponse:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean}
        message: {type: string}

    PtdBackupRunResponse:
      type: object
      required: [filename, site_count, size, backed_up_at]
      properties:
        filename: {type: string, example: PTD_backup_20260904T1200.zip}
        site_count: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, description: ZIP size in bytes.}
        backed_up_at: {type: string, format: date-time}

    SiteCredentialsResponse:
      type: object
      description: Sensitive stored credentials for a single site. Responses must not be cached.
      required: [auth_type, cookie, passkey, api_key]
      properties:
        auth_type: {type: string, enum: [cookie, passkey, cookie_passkey, api_key], readOnly: true}
        cookie: {type: string, nullable: true, readOnly: true}
        passkey: {type: string, nullable: true, readOnly: true}
        api_key: {type: string, nullable: true, readOnly: true}

    SiteStatsRecord:
      type: object
      properties:
        site_id: {type: integer, format: int64}
        uid: {type: string, nullable: true}
        username: {type: string, nullable: true}
        uploaded: {type: integer, format: int64, nullable: true}
        downloaded: {type: integer, format: int64, nullable: true}
        ratio: {type: number, format: double, nullable: true}
        bonus: {type: number, format: double, nullable: true}
        seeding_count: {type: integer, format: int32, nullable: true}
        leeching_count: {type: integer, format: int32, nullable: true}
        is_donor: {type: boolean, nullable: true}
        level_id: {type: integer, format: int64, nullable: true}
        level_name: {type: string, nullable: true}
        join_time: {type: integer, format: int64, nullable: true, description: Unix timestamp in milliseconds.}
        last_access_at: {type: integer, format: int64, nullable: true, description: Unix timestamp in milliseconds.}
        message_count: {type: integer, format: int64, nullable: true}
        invites: {type: integer, format: int64, nullable: true}
        avatar: {type: string, nullable: true}
        total_traffic: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_downloaded: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_uploaded: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_ratio: {type: number, format: double, nullable: true}
        seeding_size: {type: integer, format: int64, nullable: true, description: Bytes.}
        seeding_time: {type: integer, format: int64, nullable: true, description: Seconds.}
        average_seeding_time: {type: integer, format: int64, nullable: true, description: Seconds.}
        seeding_bonus: {type: number, format: double, nullable: true}
        bonus_per_hour: {type: number, format: double, nullable: true}
        seeding_bonus_per_hour: {type: number, format: double, nullable: true}
        uploads: {type: integer, format: int64, nullable: true}
        snatches: {type: integer, format: int64, nullable: true}
        posts: {type: integer, format: int64, nullable: true}
        adoptions: {type: integer, format: int64, nullable: true}
        hnr_unsatisfied: {type: integer, format: int64, nullable: true}
        hnr_pre_warning: {type: integer, format: int64, nullable: true}
        updated_at: {type: string, nullable: true}
        last_checked_at: {type: string}
        last_error: {type: string, nullable: true}

    CreateSiteRequest:
      type: object
      required: [name, site_type, base_url, auth_config]
      properties:
        name: {type: string}
        site_type: {type: string}
        base_url: {type: string}
        auth_config: {$ref: '#/components/schemas/SiteAuthConfig'}
        request_headers:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/SiteRequestHeader'}
          description: Defaults to the built-in browser fingerprint headers when omitted.
        use_proxy: {type: boolean, default: true}

    UpdateSiteRequest:
      type: object
      required: [name, site_type, base_url]
      properties:
        name: {type: string}
        site_type: {type: string}
        base_url: {type: string}
        request_headers:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/SiteRequestHeader'}
          description: Omission preserves the existing request headers; an empty array removes all of them.
        auth_config:
          allOf: [{$ref: '#/components/schemas/SiteAuthConfig'}]
          nullable: true
          description: >-
            Omission preserves the existing credentials. Empty secret values preserve the
            corresponding stored value when the site and authentication types are unchanged.
        clear_auth_config:
          type: boolean
          default: false
          description: >-
            Explicitly clear the stored credentials. Cannot be combined with non-empty incoming
            credentials or with a site/authentication type change.
        use_proxy: {type: boolean, default: true}

    SiteAuthConfig:
      type: object
      required: [auth_type]
      additionalProperties: false
      properties:
        auth_type: {type: string, enum: [cookie, passkey, cookie_passkey, api_key]}
        cookie: {type: string, nullable: true, writeOnly: true}
        passkey: {type: string, nullable: true, writeOnly: true}
        api_key: {type: string, nullable: true, writeOnly: true}

    SiteRequestHeader:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        value: {type: string, maxLength: 8192}

    UserStats:
      type: object
      properties:
        uid: {type: string, nullable: true}
        username: {type: string}
        uploaded: {type: integer, format: int64}
        downloaded: {type: integer, format: int64}
        ratio: {type: number, format: double, nullable: true}
        bonus: {type: number, format: double, nullable: true}
        seeding_count: {type: integer, format: int32, nullable: true}
        leeching_count: {type: integer, format: int32, nullable: true}
        is_donor: {type: boolean, nullable: true}
        level_id: {type: integer, format: int64, nullable: true}
        level_name: {type: string, nullable: true}
        join_time: {type: integer, format: int64, nullable: true, description: Unix timestamp in milliseconds.}
        last_access_at: {type: integer, format: int64, nullable: true, description: Unix timestamp in milliseconds.}
        message_count: {type: integer, format: int64, nullable: true}
        invites: {type: integer, format: int64, nullable: true}
        avatar: {type: string, nullable: true}
        total_traffic: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_downloaded: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_uploaded: {type: integer, format: int64, nullable: true, description: Bytes.}
        true_ratio: {type: number, format: double, nullable: true}
        seeding_size: {type: integer, format: int64, nullable: true, description: Bytes.}
        seeding_time: {type: integer, format: int64, nullable: true, description: Seconds.}
        average_seeding_time: {type: integer, format: int64, nullable: true, description: Seconds.}
        seeding_bonus: {type: number, format: double, nullable: true}
        bonus_per_hour: {type: number, format: double, nullable: true}
        seeding_bonus_per_hour: {type: number, format: double, nullable: true}
        uploads: {type: integer, format: int64, nullable: true}
        snatches: {type: integer, format: int64, nullable: true}
        posts: {type: integer, format: int64, nullable: true}
        adoptions: {type: integer, format: int64, nullable: true}
        hnr_unsatisfied: {type: integer, format: int64, nullable: true}
        hnr_pre_warning: {type: integer, format: int64, nullable: true}

    SiteSyncResult:
      type: object
      properties:
        success: {type: boolean}
        message: {type: string}
        user_stats: {allOf: [{$ref: '#/components/schemas/UserStats'}], nullable: true}

    DownloaderResponse:
      type: object
      description: The downloader password is write-only and is never returned by the API.
      required: [id, name, downloader_type, url, username, password_configured, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        downloader_type: {type: string}
        url: {type: string}
        username: {type: string}
        password_configured: {type: boolean, readOnly: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    CreateDownloaderRequest:
      type: object
      required: [name, downloader_type, url]
      properties:
        name: {type: string}
        downloader_type: {type: string}
        url: {type: string}
        username: {type: string, nullable: true}
        password: {type: string, nullable: true, writeOnly: true}
        copy_from_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Source downloader whose saved password is reused when password is empty.

    UpdateDownloaderRequest:
      type: object
      required: [name, downloader_type, url]
      properties:
        name: {type: string}
        downloader_type: {type: string}
        url: {type: string}
        username: {type: string, nullable: true}
        password:
          type: string
          nullable: true
          writeOnly: true
          description: Null, an empty string, or omission preserves the existing password.
        clear_password:
          type: boolean
          default: false
          description: Clear the stored password. Cannot be combined with a non-empty password.

    DownloaderTestResult:
      type: object
      properties:
        success: {type: boolean}
        message: {type: string}
        version: {type: string, nullable: true}
        free_space: {type: integer, format: int64, nullable: true}

    DownloaderSpaceStats:
      type: object
      properties:
        free_space: {type: integer, format: int64}
        pending_download_bytes: {type: integer, format: int64}
        effective_free_space: {type: integer, format: int64}
        torrent_count: {type: integer, format: int64}
        incomplete_count: {type: integer, format: int64}

    DownloaderTorrent:
      type: object
      required: [hash, name, size, downloaded, save_path, category, tags, added_on, progress, state]
      properties:
        hash: {type: string}
        name: {type: string}
        size: {type: integer, format: int64}
        downloaded: {type: integer, format: int64}
        save_path: {type: string}
        category: {type: string}
        tags: {type: string}
        added_on: {type: integer, format: int64}
        progress: {type: number, format: double}
        state: {type: string}

    BrushTaskRecord:
      type: object
      additionalProperties: true

    BrushTaskRequest:
      type: object
      required: [name, cron_expression, downloader_id, tag, rss_url]
      additionalProperties: true

    BrushTorrentRecord:
      type: object
      additionalProperties: true

    BrushTaskTorrentsResponse:
      type: object
      properties:
        task: {$ref: '#/components/schemas/BrushTaskRecord'}
        page: {type: integer, format: int64}
        page_size: {type: integer, format: int64}
        total_records: {type: integer, format: int64}
        records: {type: array, items: {$ref: '#/components/schemas/BrushTorrentRecord'}}

    TaskStatsSnapshot:
      type: object
      properties:
        id: {type: integer, format: int64}
        task_id: {type: integer, format: int64}
        total_uploaded: {type: integer, format: int64}
        total_downloaded: {type: integer, format: int64}
        torrent_count: {type: integer, format: int64}
        recorded_at: {type: string}

    DownloaderSpeedSnapshot:
      type: object
      properties:
        id: {type: integer, format: int64}
        downloader_id: {type: integer, format: int64}
        upload_speed: {type: integer, format: int64}
        download_speed: {type: integer, format: int64}
        recorded_at: {type: string}

    StatsOverview:
      type: object
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              task_id: {type: integer, format: int64}
              task_name: {type: string}
              total_uploaded: {type: integer, format: int64}
              total_downloaded: {type: integer, format: int64}
              torrent_count: {type: integer, format: int64}
              enabled: {type: boolean}

    MediaSettingsResponse:
      type: object
      description: The configured TMDB token is never returned by the API.
      required: [tmdb_token, tmdb_token_configured, tmdb_language, scan_interval_mins, max_search_queries, search_concurrency, updated_at]
      properties:
        tmdb_token:
          type: string
          nullable: true
          readOnly: true
          description: Always null so the stored token cannot be read back.
        tmdb_token_configured: {type: boolean, readOnly: true}
        tmdb_language: {type: string, default: zh-CN}
        scan_interval_mins: {type: integer, format: int64, minimum: 1, maximum: 10080, default: 30}
        max_search_queries: {type: integer, minimum: 2, maximum: 32, default: 8}
        search_concurrency:
          type: integer
          minimum: 1
          maximum: 16
          default: 4
          description: Maximum number of different PT site origins searched concurrently. Requests to one origin are serialized and rate limited.
        updated_at: {type: string, format: date-time, readOnly: true}

    UpdateMediaSettingsRequest:
      type: object
      required: [tmdb_language, scan_interval_mins, max_search_queries, search_concurrency]
      properties:
        tmdb_token:
          type: string
          maxLength: 4096
          nullable: true
          description: >-
            TMDB v3 API key or v4 Read Access Token. Null, an empty string, or omission preserves
            the existing token unless clear_tmdb_token is true.
        clear_tmdb_token:
          type: boolean
          default: false
          description: Clear the stored token. Cannot be combined with a non-empty tmdb_token.
        tmdb_language: {type: string, minLength: 1, maxLength: 32, default: zh-CN}
        scan_interval_mins: {type: integer, format: int64, minimum: 1, maximum: 10080, default: 30}
        max_search_queries: {type: integer, minimum: 2, maximum: 32, default: 8}
        search_concurrency:
          type: integer
          minimum: 1
          maximum: 16
          default: 4
          description: Maximum number of different PT site origins searched concurrently. Requests to one origin are serialized and rate limited.

    TmdbMedia:
      type: object
      required: [tmdb_id, media_type, title, original_title, year, overview, poster_path]
      properties:
        tmdb_id: {type: integer, format: int64}
        media_type: {type: string, enum: [tv, movie]}
        title: {type: string}
        original_title: {type: string, nullable: true}
        year: {type: integer, format: int32, nullable: true}
        overview: {type: string}
        poster_path:
          type: string
          nullable: true
          description: TMDB image path, not a complete URL.

    TmdbDetails:
      allOf:
        - {$ref: '#/components/schemas/TmdbMedia'}
        - type: object
          required: [aliases, number_of_seasons, status]
          properties:
            aliases: {type: array, items: {type: string}}
            number_of_seasons: {type: integer, format: int32, nullable: true}
            status: {type: string, nullable: true}

    TmdbEpisode:
      type: object
      required: [id, season_number, episode_number, name, overview, air_date, runtime]
      properties:
        id: {type: integer, format: int64}
        season_number: {type: integer, format: int32, minimum: 0}
        episode_number: {type: integer, format: int32, minimum: 0}
        name: {type: string}
        overview: {type: string}
        air_date: {type: string, format: date, nullable: true}
        runtime: {type: integer, format: int32, nullable: true}

    TmdbSeason:
      type: object
      required: [id, tmdb_id, season_number, name, overview, poster_path, air_date, episodes]
      properties:
        id: {type: integer, format: int64}
        tmdb_id: {type: integer, format: int64}
        season_number: {type: integer, format: int32, minimum: 0}
        name: {type: string}
        overview: {type: string}
        poster_path: {type: string, nullable: true}
        air_date: {type: string, format: date, nullable: true}
        episodes: {type: array, items: {$ref: '#/components/schemas/TmdbEpisode'}}

    QualityProfileRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        resolution_order: {type: array, items: {type: string}, default: []}
        allowed_resolutions: {type: array, items: {type: string}, default: []}
        blocked_resolutions: {type: array, items: {type: string}, default: []}
        source_order: {type: array, items: {type: string}, default: []}
        allowed_sources: {type: array, items: {type: string}, default: []}
        codec_order: {type: array, items: {type: string}, default: []}
        blocked_codecs: {type: array, items: {type: string}, default: []}
        allow_unknown_quality: {type: boolean, default: false}
        minimum_score: {type: integer, format: int32, minimum: 0, maximum: 100, default: 80}
        min_seeders: {type: integer, format: int32, minimum: 0, maximum: 1000000, default: 1}

    QualityProfile:
      allOf:
        - {$ref: '#/components/schemas/QualityProfileRequest'}
        - type: object
          required:
            - id
            - resolution_order
            - allowed_resolutions
            - blocked_resolutions
            - source_order
            - allowed_sources
            - codec_order
            - blocked_codecs
            - allow_unknown_quality
            - minimum_score
            - min_seeders
            - created_at
            - updated_at
          properties:
            id: {type: integer, format: int64}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}

    CreateMediaSubscriptionRequest:
      type: object
      required: [tmdb_id, media_type, quality_profile_id, downloader_id, site_ids]
      properties:
        tmdb_id: {type: integer, format: int64}
        media_type: {type: string, enum: [tv, movie]}
        season:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Required for TV subscriptions; null for movies.
        start_episode: {type: integer, format: int32, minimum: 1, nullable: true}
        absolute_episode:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Optional anime absolute-number anchor corresponding to start_episode.
        quality_profile_id: {type: integer, format: int64}
        downloader_id: {type: integer, format: int64}
        site_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        save_path: {type: string, maxLength: 1024, nullable: true}
        enabled: {type: boolean, default: true}

    UpdateMediaSubscriptionRequest:
      type: object
      required: [quality_profile_id, downloader_id, site_ids, enabled]
      properties:
        season: {type: integer, format: int32, minimum: 0, nullable: true}
        next_episode:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: A newly selected TV episode remains metadata-pending until TMDB confirms it.
        absolute_episode: {type: integer, format: int32, minimum: 1, nullable: true}
        quality_profile_id: {type: integer, format: int64}
        downloader_id: {type: integer, format: int64}
        site_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        save_path: {type: string, maxLength: 1024, nullable: true}
        enabled: {type: boolean}
        reset_download_history:
          type: boolean
          default: false
          description: >-
            For TV only, delete terminal kirara download and relocation history from the selected
            episode onward and reopen submitted targets. Does not delete qB or OpenList data and
            fails with 409 while related work is active.

    MediaSubscription:
      type: object
      required:
        - id
        - tmdb_id
        - media_type
        - title
        - original_title
        - aliases
        - year
        - poster_path
        - season
        - next_episode
        - start_episode
        - absolute_episode
        - quality_profile_id
        - downloader_id
        - site_ids
        - save_path
        - enabled
        - next_run_at
        - lease_owner
        - lease_until
        - version
        - last_status
        - last_error
        - last_run_at
        - created_at
        - updated_at
      properties:
        id: {type: integer, format: int64}
        tmdb_id: {type: integer, format: int64}
        media_type: {type: string, enum: [tv, movie]}
        title: {type: string}
        original_title: {type: string, nullable: true}
        aliases: {type: array, items: {type: string}}
        year: {type: integer, format: int32, nullable: true}
        poster_path: {type: string, nullable: true}
        season: {type: integer, format: int32, nullable: true}
        next_episode: {type: integer, format: int32, nullable: true}
        start_episode: {type: integer, format: int32, nullable: true}
        absolute_episode: {type: integer, format: int32, nullable: true}
        quality_profile_id: {type: integer, format: int64}
        downloader_id: {type: integer, format: int64}
        site_ids: {type: array, items: {type: integer, format: int64}}
        save_path: {type: string, nullable: true}
        enabled: {type: boolean}
        next_run_at: {type: string, format: date-time}
        lease_owner: {type: string, nullable: true}
        lease_until: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
        last_status:
          type: string
          nullable: true
          description: Includes waiting_air_date, awaiting_metadata, queued, submitted, error, and completed.
        last_error: {type: string, nullable: true}
        last_run_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SeasonEpisode:
      type: object
      required: [season, episode]
      properties:
        season: {type: integer, format: int32, minimum: 0}
        episode: {type: integer, format: int32, minimum: 1}

    MediaTarget:
      oneOf:
        - type: object
          required: [target_type, tmdb_id, titles]
          properties:
            target_type: {type: string, enum: [movie]}
            tmdb_id: {type: integer, format: int64}
            titles: {type: array, minItems: 1, maxItems: 32, items: {type: string, minLength: 1, maxLength: 512}}
            year: {type: integer, format: int32, nullable: true}
        - type: object
          required: [target_type, tmdb_id, titles, season, episode]
          properties:
            target_type: {type: string, enum: [episode]}
            tmdb_id: {type: integer, format: int64}
            titles: {type: array, minItems: 1, maxItems: 32, items: {type: string, minLength: 1, maxLength: 512}}
            year: {type: integer, format: int32, nullable: true}
            season: {type: integer, format: int32, minimum: 0}
            episode: {type: integer, format: int32, minimum: 1}
            allow_season_pack: {type: boolean, default: false}
        - type: object
          required: [target_type, tmdb_id, titles, absolute_episode]
          properties:
            target_type: {type: string, enum: [anime]}
            tmdb_id: {type: integer, format: int64}
            titles: {type: array, minItems: 1, maxItems: 32, items: {type: string, minLength: 1, maxLength: 512}}
            year: {type: integer, format: int32, nullable: true}
            absolute_episode: {type: integer, format: int32, minimum: 1}
            season_episode: {type: object, allOf: [{$ref: '#/components/schemas/SeasonEpisode'}], nullable: true}
        - type: object
          required: [target_type, tmdb_id, titles, season]
          properties:
            target_type: {type: string, enum: [season]}
            tmdb_id: {type: integer, format: int64}
            titles: {type: array, minItems: 1, maxItems: 32, items: {type: string, minLength: 1, maxLength: 512}}
            year: {type: integer, format: int32, nullable: true}
            season: {type: integer, format: int32, minimum: 0}
      discriminator:
        propertyName: target_type

    ResourceSearchRequest:
      type: object
      description: Supply a non-empty query, a typed target, or both. A target enables identity and quality evaluation.
      anyOf:
        - required: [query]
        - required: [target]
      properties:
        query: {type: string, minLength: 1, maxLength: 512}
        site_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: {type: integer, format: int64, minimum: 1}
          default: []
          description: Empty or omitted searches all configured supported PT sites.
        target: {type: object, allOf: [{$ref: '#/components/schemas/MediaTarget'}], nullable: true}
        quality_profile_id: {type: integer, format: int64, nullable: true, default: 1}
        page_size: {type: integer, format: int32, minimum: 1, maximum: 100, nullable: true, default: 30}

    SearchResult:
      type: object
      description: >-
        Credential-free normalized PT result. detail_url is sanitized and same-origin;
        download_locator is an opaque public locator such as the torrent ID, never a credential.
      required: [site_id, source_site, torrent_id, title, detail_url, download_locator, magnet, size, seeders, leechers, publish_time]
      properties:
        site_id: {type: integer, format: int64}
        source_site: {type: string}
        torrent_id: {type: string}
        title: {type: string}
        detail_url: {type: string, format: uri, nullable: true}
        download_locator: {type: string, nullable: true}
        magnet: {type: string, nullable: true}
        size: {type: integer, format: int64, minimum: 0}
        seeders: {type: integer, format: int32, minimum: 0}
        leechers: {type: integer, format: int32, minimum: 0}
        publish_time: {type: string, format: date-time, nullable: true}

    ReleaseInfo:
      type: object
      required: [raw_title, title, alternate_titles, year, season, episodes, absolute_episodes, full_season, resolution, codec, source, hdr_formats, bit_depth, revision, release_group, matched_rule]
      properties:
        raw_title: {type: string}
        title: {type: string}
        alternate_titles: {type: array, items: {type: string}}
        year: {type: integer, format: int32, nullable: true}
        season: {type: integer, format: int32, nullable: true}
        episodes: {type: array, items: {type: integer, format: int32}}
        absolute_episodes: {type: array, items: {type: integer, format: int32}}
        full_season: {type: boolean}
        resolution: {type: string, nullable: true}
        codec: {type: string, nullable: true}
        source: {type: string, nullable: true}
        hdr_formats:
          type: array
          items: {type: string, enum: [Dolby Vision, HDR10+, HDR10, HLG, HDR]}
        bit_depth: {type: integer, format: int32, nullable: true, enum: [8, 10, 12]}
        revision: {type: string, nullable: true}
        release_group: {type: string, nullable: true}
        matched_rule: {type: string}

    ScoreBreakdown:
      type: object
      required: [title, year, season, episode, quality]
      properties:
        title: {type: integer, format: int32, minimum: 0}
        year: {type: integer, format: int32, minimum: 0}
        season: {type: integer, format: int32, minimum: 0}
        episode: {type: integer, format: int32, minimum: 0}
        quality: {type: integer, format: int32, minimum: 0}

    MatchRejection:
      type: object
      required: [code, message, permanent]
      properties:
        code:
          type: string
          enum: [wrong_media, wrong_title, wrong_year, wrong_season, wrong_episode, ambiguous_numbering, season_pack_not_allowed, quality_not_allowed, unknown_quality, minimum_seeders, below_minimum_score]
        message: {type: string}
        permanent: {type: boolean}

    MatchDecision:
      type: object
      description: Identity, season, episode, and quality rejections are hard gates and cannot be offset by score.
      required: [accepted, score, breakdown, quality_rank, rejections, explanations]
      properties:
        accepted: {type: boolean}
        score: {type: integer, format: int32, minimum: 0}
        breakdown: {$ref: '#/components/schemas/ScoreBreakdown'}
        quality_rank: {type: integer, format: int64, minimum: 0}
        rejections: {type: array, items: {$ref: '#/components/schemas/MatchRejection'}}
        explanations: {type: array, items: {type: string}}

    SortKey:
      type: object
      description: >-
        Deterministic best-first key. Ordering is accepted, resolution, source, size
        fitness, eligible video features, codec, seeders, score, publish time, site
        priority, stable key. Video features rank as zero until size fitness reaches 1000.
      required: [accepted, score, quality_rank, resolution_rank, video_feature_rank, source_rank, size_fitness, size_per_item, size_target, codec_rank, seeders, publish_time, site_priority, stable_release_key]
      properties:
        accepted: {type: boolean}
        score: {type: integer, format: int32, minimum: 0}
        quality_rank: {type: integer, format: int64, minimum: 0}
        resolution_rank: {type: integer, format: int64, minimum: 0}
        video_feature_rank: {type: integer, format: int32, minimum: 0}
        source_rank: {type: integer, format: int64, minimum: 0}
        size_fitness: {type: integer, format: int32, minimum: 0, maximum: 1000}
        size_per_item: {type: integer, format: int64, minimum: 0}
        size_target: {type: integer, format: int64, minimum: 1}
        codec_rank: {type: integer, format: int64, minimum: 0}
        seeders: {type: integer, format: int32, minimum: 0}
        publish_time: {type: string, format: date-time, nullable: true}
        site_priority: {type: integer, format: int32, minimum: 0}
        stable_release_key: {type: string}

    ResourceCandidate:
      type: object
      required: [candidate_id, result, release, parse_error, decision, sort_key]
      properties:
        candidate_id:
          type: string
          minLength: 1
          description: Short-lived opaque server-owned identifier required when queueing this exact result.
        result: {$ref: '#/components/schemas/SearchResult'}
        release: {type: object, allOf: [{$ref: '#/components/schemas/ReleaseInfo'}], nullable: true}
        parse_error: {type: string, nullable: true}
        decision: {type: object, allOf: [{$ref: '#/components/schemas/MatchDecision'}], nullable: true}
        sort_key: {type: object, allOf: [{$ref: '#/components/schemas/SortKey'}], nullable: true}

    SiteSearchError:
      type: object
      required: [site_id, source_site, query, code, message]
      properties:
        site_id: {type: integer, format: int64}
        source_site: {type: string}
        query: {type: string}
        code: {type: string, enum: [configuration_error, authentication_expired, http_error, api_error, rate_limited, parse_error, unsafe_url, invalid_torrent]}
        message: {type: string}

    ResourceSearchResponse:
      type: object
      description: successful_sites may be lower than total_sites; inspect errors for partial failures.
      required: [queries, candidates, errors, total_sites, successful_sites]
      properties:
        queries: {type: array, items: {type: string}}
        candidates: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/ResourceCandidate'}}
        errors: {type: array, items: {$ref: '#/components/schemas/SiteSearchError'}}
        total_sites: {type: integer, minimum: 0}
        successful_sites: {type: integer, minimum: 0}

    QueueMediaDownloadRequest:
      type: object
      additionalProperties: false
      required: [candidate_id, quality_profile_id, downloader_id]
      properties:
        candidate_id:
          type: string
          minLength: 1
          description: Opaque identifier returned by a recent resource search.
        quality_profile_id: {type: integer, format: int64}
        downloader_id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64, nullable: true}
        override_reason:
          type: string
          maxLength: 1000
          nullable: true
          description: Required when the server's authoritative match decision is rejected.

    MediaDownload:
      type: object
      description: Durable outbox record. JSON snapshot fields are serialized strings retained for audit and replay.
      required:
        - id
        - subscription_id
        - target_key
        - dedupe_key
        - site_id
        - downloader_id
        - source_site
        - downloader_name
        - torrent_id
        - title
        - size
        - release_json
        - decision_json
        - profile_snapshot_json
        - infohash
        - status
        - attempts
        - next_attempt_at
        - lease_owner
        - lease_until
        - version
        - last_error
        - created_at
        - updated_at
        - submitted_at
        - parsed_release
        - failed_reconciliation_allowed
      properties:
        id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64, nullable: true}
        target_key: {type: string, minLength: 1}
        dedupe_key: {type: string, minLength: 1}
        site_id: {type: integer, format: int64, nullable: true}
        downloader_id: {type: integer, format: int64, nullable: true}
        source_site: {type: string}
        downloader_name: {type: string}
        torrent_id: {type: string}
        title: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        release_json: {type: string}
        decision_json: {type: string}
        profile_snapshot_json: {type: string}
        infohash:
          type: string
          pattern: '^(?:[0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$'
          nullable: true
          description: >-
            Case-insensitively unique together with downloader_id. The same torrent may be
            submitted independently to different downloaders.
        status: {type: string, enum: [queued, fetching, submitting, reconciling, retry_wait, submitted, failed, cancelled]}
        attempts: {type: integer, format: int32, minimum: 0}
        next_attempt_at: {type: string, format: date-time, nullable: true}
        lease_owner: {type: string, nullable: true}
        lease_until: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
        last_error: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time, nullable: true}
        parsed_release:
          type: object
          allOf: [{$ref: '#/components/schemas/ReleaseInfo'}]
          nullable: true
        failed_reconciliation_allowed:
          type: boolean
          description: >-
            True only while a failed subscription download has a valid infohash, its current
            target remains queued, and no download or relocation work prevents a read-only qB check.

    DeleteMediaDownloadResponse:
      type: object
      required:
        - deleted_id
        - subscription_id
        - target_reopened
        - qb_torrent_deleted
        - openlist_data_deleted
      properties:
        deleted_id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64, nullable: true}
        target_reopened: {type: boolean}
        qb_torrent_deleted: {type: boolean, enum: [false]}
        openlist_data_deleted: {type: boolean, enum: [false]}

    ReconcileFailedMediaDownloadResponse:
      allOf:
        - {$ref: '#/components/schemas/MediaDownload'}
        - type: object
          required: [resolution]
          properties:
            resolution: {type: string, enum: [submitted, retry_ready]}

    SubscriptionRunResult:
      type: object
      required: [subscription_id, target_key, query_count, candidate_count, accepted_count, download, site_errors]
      properties:
        subscription_id: {type: integer, format: int64}
        target_key: {type: string, minLength: 1}
        query_count: {type: integer, minimum: 0}
        candidate_count: {type: integer, minimum: 0}
        accepted_count: {type: integer, minimum: 0}
        download: {type: object, allOf: [{$ref: '#/components/schemas/MediaDownload'}], nullable: true}
        site_errors: {type: array, items: {$ref: '#/components/schemas/SiteSearchError'}}

    SubscriptionRunSnapshot:
      type: object
      required: [started_at, finished_at, target_key, queries, candidates, site_errors, total_sites, successful_sites, best_candidate_id, error]
      properties:
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        target_key: {type: string, minLength: 1}
        queries: {type: array, items: {type: string}}
        candidates:
          type: array
          maxItems: 512
          description: Diagnostic copies of evaluated candidates; candidate_id values are not valid for later queue requests.
          items: {$ref: '#/components/schemas/ResourceCandidate'}
        site_errors: {type: array, items: {$ref: '#/components/schemas/SiteSearchError'}}
        total_sites: {type: integer, minimum: 0}
        successful_sites: {type: integer, minimum: 0}
        best_candidate_id: {type: string, nullable: true}
        error: {type: string, nullable: true}

    IdResponse:
      type: object
      properties:
        id: {type: integer, format: int64}

    OkResponse:
      type: object
      properties:
        ok: {type: boolean}
