name: Search checks

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "crates/search-encoder/**"
      - "assets/search/**"
      - "tests/fixtures/search/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/search.yml"
  pull_request:
    paths:
      - "src/**"
      - "crates/search-encoder/**"
      - "assets/search/**"
      - "tests/fixtures/search/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/search.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  search-assets:
    name: Test local search and assets
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test native encoder parity
        run: cargo test --locked --release --package search-encoder
      - name: Verify checked-in catalog and vectors
        run: cargo run --locked --release --package search-encoder --example assets -- verify
      - name: Test search database and API behavior
        run: |
          # Search tests need the embed directory, but do not serve the UI bundle.
          mkdir -p frontend/dist
          cargo test --locked --package kirara --lib search::
