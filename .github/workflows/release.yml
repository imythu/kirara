name: Release

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src-tauri/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "正式版版本号，例如 2.0.0；留空则自动生成 snapshot 版本"
        required: false
        default: ""
      prerelease:
        description: "手动发布时是否标记为预发布"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "手动追加的发布说明（可选）"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Determine release metadata
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_kind: ${{ steps.meta.outputs.release_kind }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel_tag: ${{ steps.meta.outputs.channel_tag }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
      published_at: ${{ steps.meta.outputs.published_at }}
      matrix_json: ${{ steps.meta.outputs.matrix_json }}
      docker_matrix_json: ${{ steps.meta.outputs.docker_matrix_json }}
    steps:
      - uses: actions/checkout@v6

      - name: Check public documentation
        shell: bash
        run: |
          if git grep -qiE 'self[_ -]?use' -- '*.md' '*.rst' '*.txt' 'doc/**'; then
            echo "public documentation contains internal-only content" >&2
            exit 1
          fi
          if git grep -qiE 'KIRARA_SOCKET|--socket|\.sock\b|unix[_ -]?socket|named[_ -]?pipe|命名管道|套接字' -- README.md 'release-notes/**' 'doc/**'; then
            echo "public documentation contains internal listener configuration" >&2
            exit 1
          fi

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          BASE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ -z "$BASE_VERSION" ]]; then
            echo "failed to determine base version from Cargo.toml" >&2
            exit 1
          fi

          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              echo "release version must match Cargo.toml" >&2
              exit 1
            fi
            RELEASE_KIND="manual"
            if [[ "$INPUT_PRERELEASE" == "true" ]]; then
              PRERELEASE="true"
              CHANNEL_TAG="rc"
              RELEASE_NAME="kirara ${VERSION} (prerelease)"
            else
              PRERELEASE="false"
              CHANNEL_TAG="latest"
              RELEASE_NAME="kirara ${VERSION}"
            fi
          else
            UTC_STAMP=$(date -u +%Y%m%d.%H%M)
            VERSION="${BASE_VERSION}-snapshot.${UTC_STAMP}.${GITHUB_RUN_NUMBER}"
            RELEASE_KIND="snapshot"
            PRERELEASE="true"
            CHANNEL_TAG="latest-beta"
            RELEASE_NAME="kirara ${VERSION} (snapshot)"
          fi

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LOWER/kirara" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$CHANNEL_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

          # Snapshot 只构建 linux/amd64，正式版构建全部平台
          if [[ "$RELEASE_KIND" == "snapshot" ]]; then
            MATRIX='[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","kind":"cli","use_cross":true}]'
            DOCKER_MATRIX='[{"target":"x86_64-unknown-linux-musl","platform":"linux/amd64","suffix":"linux-amd64"}]'
          else
            MATRIX='[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","kind":"cli","use_cross":true},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","kind":"cli","use_cross":true},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","kind":"desktop","bundle":"nsis","extension":"exe","use_cross":false},{"os":"macos-latest","target":"aarch64-apple-darwin","kind":"desktop","bundle":"dmg","extension":"dmg","use_cross":false}]'
            DOCKER_MATRIX='[{"target":"x86_64-unknown-linux-musl","platform":"linux/amd64","suffix":"linux-amd64"},{"target":"aarch64-unknown-linux-musl","platform":"linux/arm64","suffix":"linux-arm64"}]'
          fi
          echo "matrix_json=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "docker_matrix_json=$DOCKER_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Check release versions and notes
        shell: python
        env:
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          RELEASE_KIND: ${{ steps.meta.outputs.release_kind }}
        run: |
          import json
          import os
          from pathlib import Path
          import tomllib

          expected = os.environ["BASE_VERSION"]
          versions = {
              "src-tauri/Cargo.toml": tomllib.loads(Path("src-tauri/Cargo.toml").read_text())["package"]["version"],
              "src-tauri/tauri.conf.json": json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"],
              "frontend/package.json": json.loads(Path("frontend/package.json").read_text())["version"],
              "frontend/package-lock.json": json.loads(Path("frontend/package-lock.json").read_text())["version"],
          }
          for path, version in versions.items():
              if version != expected:
                  raise SystemExit(f"{path}: version {version} does not match {expected}")
          if os.environ["RELEASE_KIND"] == "manual":
              notes = Path(f"release-notes/{expected}.md")
              if not notes.is_file() or not notes.read_text().strip():
                  raise SystemExit(f"missing release notes: {notes}")

  frontend:
    name: Build frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build:
    name: Build ${{ matrix.kind }} ${{ matrix.target }}
    needs: [prepare, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_json) }}

    steps:
      - uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js for desktop packaging
        if: matrix.kind == 'desktop'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test backend on desktop platform
        if: matrix.kind == 'desktop'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked --package kirara --lib --tests --target ${{ matrix.target }}

      - name: Test desktop bridge on desktop platform
        if: matrix.kind == 'desktop'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked --package kirara-desktop --tests --target ${{ matrix.target }}

      - name: Build Linux binary
        if: matrix.kind == 'cli'
        run: |
          ${{ matrix.use_cross && 'cross' || 'cargo' }} build --locked --release --package kirara --target ${{ matrix.target }}

      - name: Build desktop installer
        if: matrix.kind == 'desktop'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > tauri-ci.conf.json
          npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundle }}" \
            --config "$GITHUB_WORKSPACE/tauri-ci.conf.json" \
            -- --locked

      - name: Collect release artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == "cli" ]]; then
            BIN="target/${{ matrix.target }}/release/kirara"
            ARCHIVE="kirara-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz"
            tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          else
            shopt -s nullglob
            INSTALLERS=(target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }})
            if [[ "${#INSTALLERS[@]}" != "1" ]]; then
              echo "expected one desktop installer, found ${#INSTALLERS[@]}" >&2
              exit 1
            fi
            if [[ "${{ matrix.bundle }}" == "nsis" ]]; then
              ARCHIVE="kirara-${{ needs.prepare.outputs.version }}-${{ matrix.target }}-setup.exe"
            else
              ARCHIVE="kirara-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.dmg"
            fi
            cp "${INSTALLERS[0]}" "$ARCHIVE"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kirara-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  docker-linux:
    name: Docker linux ${{ matrix.platform }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.docker_matrix_json) }}

    steps:
      - uses: actions/checkout@v6

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: kirara-${{ matrix.target }}
          path: docker/linux

      - name: Extract binary artifact
        shell: bash
        run: |
          cd docker/linux
          tar xzf kirara-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz
          chmod +x kirara

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_meta
        shell: bash
        run: |
          set -euo pipefail
          TAGS="${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}"
          if [[ -n "${{ needs.prepare.outputs.channel_tag }}" ]]; then
            TAGS="$TAGS"$'\n'"${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.channel_tag }}-${{ matrix.suffix }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/linux
          file: docker/linux/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

  docker-linux-manifest:
    name: Docker linux manifest
    needs: [prepare, docker-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create linux manifest
        shell: bash
        env:
          DOCKER_MATRIX: ${{ needs.prepare.outputs.docker_matrix_json }}
        run: |
          set -euo pipefail

          IMAGE="${{ needs.prepare.outputs.image }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          CHANNEL_TAG="${{ needs.prepare.outputs.channel_tag }}"

          # 从构建矩阵中提取实际构建的架构后缀
          SOURCES=()
          for suffix in $(echo "$DOCKER_MATRIX" | jq -r '.[].suffix'); do
            SOURCES+=("${IMAGE}:${VERSION}-${suffix}")
          done

          echo "Creating manifest from: ${SOURCES[*]}"

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${SOURCES[@]}"

          if [[ -n "$CHANNEL_TAG" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${CHANNEL_TAG}" \
              "${SOURCES[@]}"
          fi

  release:
    name: Create Release
    needs: [prepare, build, docker-linux-manifest]
    if: always() && needs.build.result == 'success' && needs.docker-linux-manifest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kirara-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        env:
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          RELEASE_KIND="${{ needs.prepare.outputs.release_kind }}"
          IMAGE="${{ needs.prepare.outputs.image }}"
          CHANNEL_TAG="${{ needs.prepare.outputs.channel_tag }}"
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          PUBLISHED_AT="${{ needs.prepare.outputs.published_at }}"

          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGE_RANGE="${PREVIOUS_TAG}..HEAD"
            CHANGE_TITLE="## 变更摘要"
          else
            CHANGE_RANGE="HEAD"
            CHANGE_TITLE="## 变更摘要（首次发布，无历史标签）"
          fi

          {
            echo "# ${TAG}"
            echo
            echo "## 发版信息"
            echo "- 版本号：\`${VERSION}\`"
            echo "- 发布类型：\`${RELEASE_KIND}\`"
            echo "- 提交：\`${SHA_SHORT}\`"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- 发布时间（UTC）：\`${PUBLISHED_AT}\`"
            echo
            echo "## 交付物"
            if [[ "$RELEASE_KIND" == "manual" ]]; then
              echo "- Linux 命令行压缩包：amd64 / arm64（\`.tar.gz\`）"
              echo "- Windows x64 桌面安装程序：\`-setup.exe\`"
              echo "- macOS Apple Silicon 桌面安装映像：\`.dmg\`"
            else
              echo "- 二进制包：Linux amd64"
            fi
            echo "- 校验文件：\`SHA256SUMS.txt\`"
            echo "- Docker 镜像：\`${IMAGE}:${VERSION}\`"
            if [[ -n "$CHANNEL_TAG" ]]; then
              echo "- 渠道镜像标签：\`${IMAGE}:${CHANNEL_TAG}\`"
            fi
            echo
            echo "## 版本策略"
            echo "- 自动推送到 \`master\`：生成 snapshot 预发布，版本格式为 \`<base>-snapshot.<UTC时间>.<run_number>\`"
            echo "- 手动触发并填写 \`version\`：生成手动发布版本，适合正式版或指定版本补发"
            echo "- Docker 渠道标签：snapshot 使用 \`latest-beta\`，正式版使用 \`latest\`，手动预发布使用 \`rc\`"
            echo
            echo "$CHANGE_TITLE"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- 对比范围：\`${PREVIOUS_TAG}..${TAG}\`"
            fi
            if [[ "$RELEASE_KIND" == "manual" ]]; then
              cat "release-notes/${VERSION}.md"
            else
              git log --no-merges --pretty=format:"- %s (%h)" "$CHANGE_RANGE" | grep -viE 'self[_ -]?use' || true
            fi
            echo
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${MANUAL_RELEASE_NOTES}" ]]; then
              echo
              echo "## 手动补充说明"
              printf '%s\n' "${MANUAL_RELEASE_NOTES}"
            fi
          } > artifacts/RELEASE_NOTES.md

          if grep -qiE 'self[_ -]?use' artifacts/RELEASE_NOTES.md; then
            echo "release notes contain internal-only content" >&2
            exit 1
          fi
          cat artifacts/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
