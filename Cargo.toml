[package]
name = "kirara"
version = "2.4.8"
edition = "2024"

[workspace]
members = ["src-tauri", "crates/search-encoder"]
default-members = ["."]
resolver = "3"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
cached = { version = "0.55", features = ["async"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
futures = "0.3"
getrandom = "0.3"
md5 = "0.7"
mime_guess = "2"
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
quick-xml = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "multipart", "rustls", "socks", "zstd"] }
qbit-rs = { version = "0.5", default-features = false, features = ["builder", "reqwest", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "hooks"] }
rust-embed = "8"
scraper = "0.24"
search-encoder = { path = "crates/search-encoder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
unicode-normalization = "0.1"
icu_casemap = "2.2"
sysinfo = "0.34"
tower-http = { version = "0.6", features = ["cors", "trace"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
